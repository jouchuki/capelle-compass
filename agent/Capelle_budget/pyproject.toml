[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "capelle-budget-tool"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx",
]

[project.scripts]
capelle-budget = "capelle_budget_tool.cli:main"

[tool.setuptools]
packages = ["capelle_budget_tool"]
