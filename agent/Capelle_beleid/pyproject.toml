[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "capelle-beleid-tool"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
    "chromadb",
    "openai",
    "PyMuPDF",
]

[project.scripts]
capelle-beleid = "capelle_beleid_tool.cli:main"

[tool.setuptools]
packages = ["capelle_beleid_tool", "capelle_beleid_tool.rag"]
