[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "capelle-jeugdzorg-tool"
version = "0.1.0"
description = "EDA + linear-regression future-trends CLI for the jeugdzorg synthetic corpus (Capelle)"
requires-python = ">=3.12"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "statsmodels>=0.14",
]

[project.scripts]
capelle-jeugdzorg = "capelle_jeugdzorg_tool.cli:JeugdzorgCLI.main"

[tool.setuptools]
packages = ["capelle_jeugdzorg_tool"]
