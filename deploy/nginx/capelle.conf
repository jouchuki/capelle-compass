# =============================================================================
# deploy/nginx/capelle.conf
# -----------------------------------------------------------------------------
# Purpose:
#   Nginx server block for the Capelle Data Assistent load balancer that lives
#   inside LXC container `masamichi-yaga` on host `gojo`. Cloudflare Tunnel
#   terminates TLS upstream and forwards plain HTTP to this container on
#   tailnet hostname `masamichi-yaga:8080`, which is this listener.
#
# Topology:
#   Cloudflare Tunnel  -->  masamichi-yaga:8080  (this nginx)
#                               |
#                               v
#                        capelle_yutas upstream pool
#                               |
#                               +-- yuta-okkotsu:8080   (the template)
#                               +-- yuta-<slug>:8080    (added by spawn-yuta.sh)
#
# Intent:
#   Single upstream today (yuta-okkotsu). As scripts/spawn-yuta.sh clones new
#   yuta-* instances, they append `server yuta-<slug>:8080 ...;` lines to the
#   `upstream capelle_yutas` block and `systemctl reload nginx`. Round-robin
#   is fine for now (stateless HTTP + WebSocket upgrades to /api/ws); we can
#   swap to `ip_hash` or `least_conn` later if affinity is needed.
#
# Hostname resolution:
#   Upstream uses bare tailnet hostnames (yuta-okkotsu). The provisioner seeds
#   /etc/hosts (or relies on Tailscale MagicDNS) so nginx can resolve them
#   without hitting an external resolver. The full tailnet DNS suffix
#   (xxx.ts.net) varies per tailnet and is not hard-coded here.
#
# TLS:
#   NOT terminated here. `listen 8080;` is plain HTTP. All TLS is at the
#   Cloudflare edge; the tunnel delivers requests over an authenticated
#   cloudflared transport, so we trust the X-Forwarded-Proto it injects.
# =============================================================================

upstream capelle_yutas {
    # Single upstream at cutover. The spawn-yuta script appends more lines.
    server yuta-okkotsu:8080 max_fails=3 fail_timeout=30s;
    # Append more yuta-* servers here as they spin up.
}

# gzip: Ubuntu's default /etc/nginx/nginx.conf already sets ``gzip on``
# in the http {} context, so we only extend the type list + proxied
# scope here. Declaring ``gzip on`` twice is a hard nginx config error.
gzip_vary on;
gzip_min_length 1024;
gzip_proxied any;
gzip_comp_level 5;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml
    application/xml+rss
    application/x-javascript
    application/wasm
    image/svg+xml;

# WebSocket upgrade map: "upgrade" -> "upgrade", otherwise "close".
# Lets us flip Connection per-request based on the client's Upgrade header.
map $http_upgrade $capelle_conn_upgrade {
    default     upgrade;
    ''          close;
}

server {
    listen      8080;
    server_name _;

    access_log /var/log/nginx/capelle.access.log;
    error_log  /var/log/nginx/capelle.error.log warn;

    # Uploads are tiny (auth JSON, small form payloads). Ohrs jobs stream
    # output over WS — they don't need a large request body.
    client_max_body_size 2m;

    # ----- Common proxy headers (repeated inside each location because
    # nginx does not inherit proxy_set_pass across locations reliably when
    # one location overrides it). Defined once here via a named block-free
    # approach: stick them at server level; locations will inherit.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-Host  $host;

    # Ohrs jobs can take up to ~20 min before they stream a first chunk.
    proxy_connect_timeout 10s;
    proxy_send_timeout    1800s;
    proxy_read_timeout    1800s;

    # HTTP/1.1 is required for keep-alive AND for the Upgrade mechanism.
    proxy_http_version 1.1;

    # WebSocket endpoint. Backend path is /api/ws (see backend routing).
    # Must be before the catch-all `location /` so it takes precedence.
    location /api/ws {
        proxy_pass http://capelle_yutas;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $capelle_conn_upgrade;

        # No buffering for streaming frames.
        proxy_buffering    off;
        proxy_request_buffering off;

        # Re-stamp headers (server-level set_header is dropped when a
        # location declares its own set_header, so repeat them).
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host  $host;
    }

    # Health endpoint: proxy straight through to a yuta. Cloudflare uses it
    # for tunnel health; ops uses it from gojo for quick liveness checks.
    location = /api/health {
        proxy_pass http://capelle_yutas;
        access_log off;
    }

    # Everything else: plain reverse-proxy to the upstream pool.
    location / {
        proxy_pass http://capelle_yutas;
    }
}
